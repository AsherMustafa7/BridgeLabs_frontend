<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Testing</title>
</head>
<body>
    <table border="10" >

        <caption>Student Examination Results</caption>

        <thead>
            <tr>
                <th rowspan="2" colspan="2" >Student ID</th>
                <th rowspan="2">Name</th>
                <th rowspan="2">Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="2">101</td>
                <td>Asher</td>
                <td>95</td>
            </tr>

            <tr>
                <td colspan="2">102</td>
                <td>Aryan</td>
                <td>88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Average Marks</td>
                <td>91.5</td>
            </tr>
        </tfoot>

    </table>


    <h1>Login</h1>
    <form action="/submit-login" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <br><br>
        <input type="submit" value="Login">
    </form>

    <iframe
    src="https://www.youtube.com/embed/watch?v=onW0gr250uM"
    width="600"
    height="400">
    </iframe>

</body>
</html>
